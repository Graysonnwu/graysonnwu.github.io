<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字幕双语对齐工具</title>
    <style>
        :root {
            /* 黑暗模式配色 */
            --bg-color: #121212;
            --border-color: #333333;
            --text-color: #e0e0e0;
            --text-muted: #888888;
            --accent-color: #555555;
            --highlight-blue: rgba(64, 156, 255, 0.8);
            
            /* 斑马纹配色 */
            --row-odd: #2a2a2a;
            --row-even: #1e1e1e;
            
            /* 行高设定 */
            --line-height: 28px;
            --padding-top: 14px;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0;
            font-weight: 500;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .toggle-btn {
            background-color: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            background-color: #3a3a3a;
            border-color: #555;
        }

        .toggle-btn:active {
            background-color: #222;
        }

        .editor-container {
            position: relative;
            min-height: 0;
            display: flex;
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            background-color: var(--row-even);
        }

        /* 悬浮的幽灵高亮行 */
        .highlight-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--line-height);
            background-color: rgba(64, 156, 255, 0.15); 
            border-top: 1px solid rgba(64, 156, 255, 0.4);
            border-bottom: 1px solid rgba(64, 156, 255, 0.4);
            pointer-events: none; /* 鼠标点击穿透 */
            box-sizing: border-box;
            z-index: 10;
            display: none; 
        }

        /* 核心对齐与斑马纹属性 */
        .sync-pane {
            font-family: 'Consolas', 'Monaco', 'Courier New', 'Microsoft YaHei', monospace;
            font-size: 14px;
            line-height: var(--line-height);
            padding: var(--padding-top) 15px;
            margin: 0;
            box-sizing: border-box;
            
            background-image: repeating-linear-gradient(
                to bottom,
                var(--row-odd) 0px,
                var(--row-odd) var(--line-height),
                var(--row-even) var(--line-height),
                var(--row-even) calc(var(--line-height) * 2)
            );
            background-attachment: local;
            background-position: 0 var(--padding-top);
        }

        .line-numbers {
            width: 60px;
            min-width: 60px;
            padding-left: 5px;
            padding-right: 15px;
            color: var(--text-muted);
            text-align: right;
            border-right: 1px solid var(--border-color);
            user-select: none;
            overflow-y: hidden;
            white-space: pre;
            filter: brightness(0.9); 
        }

        .text-editor {
            flex: 1; /* 初始平分宽度 */
            min-width: 50px; /* 防止被缩得太小 */
            color: #ffffff;
            border: none;
            resize: none;
            outline: none;
            white-space: pre; 
            width: 100%;
            display: block;
            overflow: hidden;
            min-height: 0;
        }
        .editor-pane {
            flex: 1;
            min-width: 50px;
            min-height: 0;
            overflow: auto;
            overflow-x: scroll;
        }

        /* 拖拽分割线 */
        .resizer {
            position: relative;
            width: 1px;
            background-color: var(--border-color);
            cursor: col-resize;
            flex-shrink: 0;
            z-index: 12;
            transition: background-color 0.2s;
        }
        
        /* 增加鼠标的可点击热区范围 */
        .resizer::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: -4px;
            right: -4px;
            cursor: col-resize;
            z-index: 13;
        }

        .resizer:hover, .resizer.dragging {
            background-color: var(--highlight-blue);
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 14px;
            height: 14px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
            border-left: 1px solid var(--border-color);
            border-top: 1px solid var(--border-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 7px;
            border: 3px solid var(--bg-color);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }
        
        /* 修复底部横竖滚动条交界处的白色突兀方块 */
        ::-webkit-scrollbar-corner {
            background-color: var(--bg-color); 
        }
        .status { font-size: 12px; color: #aaa; margin: 10px 0 0; min-height: 18px; }
        .status.mismatch { color: #f5bd73; }
        .header { gap: 12px; flex-wrap: wrap; }
        .toggle-btn:focus-visible, .resizer:focus-visible { outline: 2px solid #409cff; outline-offset: 2px; }
        .resizer { touch-action: none; }
        @media (max-width: 600px) { body { padding: 10px; } h1 { font-size: 1rem; } .line-numbers { width: 42px; min-width: 42px; padding-right: 8px; } .sync-pane { font-size: 12px; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>字幕双语对齐工具</h1>
        <button id="toggle-btn" class="toggle-btn" aria-pressed="false">切换至三列模式</button>
    </div>

    <div class="editor-container">
        <!-- 高亮层 -->
        <div id="highlight-bar" class="highlight-bar"></div>

        <!-- 左侧行号 -->
        <div id="line-numbers" class="sync-pane line-numbers">1</div>
        
        <!-- 文本框 1 (左) -->
        <div class="editor-pane"><textarea id="left-text" aria-label="英文原文" class="sync-pane text-editor" wrap="off" spellcheck="false" placeholder="在此粘贴英文原文..."></textarea></div>
        
        <!-- 分割线 1 -->
        <div class="resizer" id="resizer-1" role="separator" aria-label="调整相邻列宽" aria-orientation="vertical" tabindex="0"></div>

        <!-- 文本框 2 (中 - 默认隐藏) -->
        <div class="editor-pane" style="display: none;"><textarea id="middle-text" aria-label="辅助参考" class="sync-pane text-editor" wrap="off" spellcheck="false" placeholder="在此粘贴机翻 / 辅助参考..."></textarea></div>
        
        <!-- 分割线 2 (默认隐藏) -->
        <div class="resizer" id="resizer-2" role="separator" aria-label="调整相邻列宽" aria-orientation="vertical" tabindex="0" style="display: none;"></div>

        <!-- 文本框 3 (右) -->
        <div class="editor-pane"><textarea id="right-text" aria-label="最终译文" class="sync-pane text-editor" wrap="off" spellcheck="false" placeholder="在此粘贴人工修改 / 最终译文..."></textarea></div>
    </div>

    <p id="status" class="status" role="status"></p>

    <script>
        const leftText = document.getElementById('left-text');
        const middleText = document.getElementById('middle-text');
        const rightText = document.getElementById('right-text');
        const editors = [leftText, middleText, rightText];
        const lineNumbers = document.getElementById('line-numbers');
        const highlightBar = document.getElementById('highlight-bar');
        const toggleBtn = document.getElementById('toggle-btn');
        const status = document.getElementById('status');
        const LINE_HEIGHT = 28, PADDING_TOP = 14;
        const DRAFT_KEY = 'subtitle-alignment-draft-v1';
        const expectedScroll = new WeakMap();
        let isThreeCol = false, activeEditor = null, currentLineIndex = -1, saveTimer = 0;
        let saved = true, lastLineCount = 0;
        const visibleEditors = () => editors.filter(editor => editor.parentElement.style.display !== 'none');
        const lineCount = editor => editor.value.split('\n').length;

        function syncScroll(source) {
            const top = source.scrollTop;
            for (const other of [...visibleEditors().map(editor => editor.parentElement), lineNumbers]) {
                if (other === source || Math.abs(other.scrollTop - top) < 1) continue;
                other.scrollTop = top;
                expectedScroll.set(other, other.scrollTop);
            }
            renderHighlight();
        }
        for (const element of [...editors.map(editor => editor.parentElement), lineNumbers]) {
            element.addEventListener('scroll', () => {
                const expected = expectedScroll.get(element);
                expectedScroll.delete(element);
                // If the browser emits no event for an unchanged scroll position, a stale
                // expectation cannot swallow the next real user scroll.
                if (expected !== undefined && Math.abs(expected - element.scrollTop) < 1) return;
                syncScroll(element);
            });
        }

        function renderHighlight() {
            if (!activeEditor || !visibleEditors().includes(activeEditor) || currentLineIndex < 0) {
                highlightBar.style.display = 'none';
                return;
            }
            const y = PADDING_TOP + currentLineIndex * LINE_HEIGHT - activeEditor.parentElement.scrollTop;
            highlightBar.style.display = y + LINE_HEIGHT >= 0 && y < activeEditor.parentElement.clientHeight ? 'block' : 'none';
            highlightBar.style.transform = `translateY(${y}px)`;
        }
        function updateActiveLine(editor) {
            activeEditor = editor;
            currentLineIndex = editor.value.slice(0, editor.selectionStart).split('\n').length - 1;
            const pane = editor.parentElement;
            const top = PADDING_TOP + currentLineIndex * LINE_HEIGHT;
            if (top < pane.scrollTop) pane.scrollTop = Math.max(0, top - PADDING_TOP);
            else if (top + LINE_HEIGHT > pane.scrollTop + pane.clientHeight) pane.scrollTop = top + LINE_HEIGHT - pane.clientHeight;
            syncScroll(pane);
            renderHighlight();
        }
        for (const editor of editors) {
            for (const event of ['mouseup', 'keyup', 'focus', 'input', 'select']) {
                editor.addEventListener(event, () => updateActiveLine(editor));
            }
            editor.addEventListener('input', () => { saved = false; updateLines(); scheduleSave(); });
        }
        document.addEventListener('selectionchange', () => {
            if (editors.includes(document.activeElement)) updateActiveLine(document.activeElement);
        });

        function updateLines() {
            const visible = visibleEditors(), counts = visible.map(lineCount);
            const max = Math.max(1, ...counts);
            if (lastLineCount !== max) { lineNumbers.textContent = Array.from({ length: max }, (_, i) => i + 1).join('\n'); lastLineCount = max; }
            // Every pane scrolls a canvas with the same height; the subtitle value is never padded.
            visible.forEach(editor => {
                editor.style.height = `${max * LINE_HEIGHT + PADDING_TOP * 2}px`;
                editor.style.width = '100%';
                const contentWidth = editor.scrollWidth;
                if (contentWidth > editor.clientWidth) editor.style.width = `${contentWidth}px`;
            });
            const pane = leftText.parentElement;
            const scrollbarHeight = Math.max(0, pane.offsetHeight - pane.clientHeight);
            lineNumbers.style.paddingBottom = `${PADDING_TOP + scrollbarHeight}px`;
            status.classList.toggle('mismatch', new Set(counts).size > 1);
            status.textContent = `原文 ${lineCount(leftText)} 行 · ${isThreeCol ? `参考 ${lineCount(middleText)} 行 · ` : ''}译文 ${lineCount(rightText)} 行${new Set(counts).size > 1 ? ' · 行数不同，请检查对应关系' : ''} · ${saved ? '草稿已保存到本机' : '草稿尚未保存，请保留副本'}`;
            syncScroll(activeEditor && visible.includes(activeEditor) ? activeEditor.parentElement : leftText.parentElement);
        }

        function setMode(threeColumns) {
            const top = activeEditor?.parentElement.scrollTop ?? leftText.parentElement.scrollTop;
            isThreeCol = threeColumns;
            editors.forEach(editor => { editor.parentElement.style.flex = '1'; });
            middleText.parentElement.style.display = threeColumns ? 'block' : 'none';
            document.getElementById('resizer-2').style.display = threeColumns ? 'block' : 'none';
            toggleBtn.textContent = threeColumns ? '切换至两列模式' : '切换至三列模式';
            toggleBtn.setAttribute('aria-pressed', String(threeColumns));
            if (!threeColumns && activeEditor === middleText) activeEditor = leftText;
            updateLines();
            leftText.parentElement.scrollTop = top;
            syncScroll(leftText.parentElement);
            renderHighlight();
        }
        toggleBtn.addEventListener('click', () => { setMode(!isThreeCol); scheduleSave(); });

        function scheduleSave() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveDraft, 300);
        }
        function saveDraft() {
            try {
                localStorage.setItem(DRAFT_KEY, JSON.stringify({ left: leftText.value, middle: middleText.value, right: rightText.value, threeColumns: isThreeCol }));
                saved = true;
            } catch { saved = false; }
            updateLines();
        }
        window.addEventListener('pagehide', saveDraft);
        try {
            const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
            if (draft && typeof draft === 'object') {
                leftText.value = typeof draft.left === 'string' ? draft.left : '';
                middleText.value = typeof draft.middle === 'string' ? draft.middle : '';
                rightText.value = typeof draft.right === 'string' ? draft.right : '';
                isThreeCol = draft.threeColumns === true;
            }
        } catch { saved = false; }

        function setupResizer(resizer) {
            let pair = null, startX = 0, startWidths = [];
            const neighbors = () => {
                const visible = visibleEditors().map(editor => editor.parentElement);
                const before = visible.filter(editor => editor.compareDocumentPosition(resizer) & Node.DOCUMENT_POSITION_FOLLOWING).at(-1);
                const after = visible.find(editor => resizer.compareDocumentPosition(editor) & Node.DOCUMENT_POSITION_FOLLOWING);
                return before && after ? [before, after] : null;
            };
            const setWidths = (panes, widths) => panes.forEach((editor, i) => {
                const style = getComputedStyle(editor);
                const padding = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
                editor.style.flex = `${Math.max(1, widths[i] - padding)} 1 0%`;
            });
            resizer.addEventListener('pointerdown', event => {
                if (event.button !== 0) return;
                pair = neighbors();
                if (!pair) return;
                event.preventDefault();
                const visible = visibleEditors().map(editor => editor.parentElement);
                const widths = visible.map(editor => editor.getBoundingClientRect().width);
                startWidths = pair.map(editor => editor.getBoundingClientRect().width);
                startX = event.clientX;
                setWidths(visible, widths);
                resizer.setPointerCapture(event.pointerId);
                resizer.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
            });
            resizer.addEventListener('pointermove', event => {
                if (!pair) return;
                const dx = Math.max(50 - startWidths[0], Math.min(startWidths[1] - 50, event.clientX - startX));
                setWidths(pair, [startWidths[0] + dx, startWidths[1] - dx]);
            });
            const stop = () => { pair = null; resizer.classList.remove('dragging'); document.body.style.cursor = ''; };
            resizer.addEventListener('pointerup', stop);
            resizer.addEventListener('pointercancel', stop);
            resizer.addEventListener('lostpointercapture', stop);
            resizer.addEventListener('keydown', event => {
                if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
                const panes = neighbors();
                if (!panes) return;
                event.preventDefault();
                const visible = visibleEditors().map(editor => editor.parentElement);
                setWidths(visible, visible.map(editor => editor.getBoundingClientRect().width));
                const widths = panes.map(editor => editor.getBoundingClientRect().width);
                const dx = event.key === 'ArrowLeft' ? -10 : 10;
                if (widths[0] + dx >= 50 && widths[1] - dx >= 50) setWidths(panes, [widths[0] + dx, widths[1] - dx]);
            });
        }
        setupResizer(document.getElementById('resizer-1'));
        setupResizer(document.getElementById('resizer-2'));
        window.addEventListener('resize', updateLines);
        setMode(isThreeCol);
    </script>
</body>
</html>
